name: Build Debug APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install dependencies
        run: |
          cd berty-bridge-expo/mobile
          yarn install --frozen-lockfile || npm install
      - name: Grant execute permission for gradlew
        run: chmod +x berty-bridge-expo/android/gradlew
      - name: Build with Gradle
        run: |
          cd berty-bridge-expo/android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Berty-debug
          path: berty-bridge-expo/android/app/build/outputs/apk/debug/*.apk
